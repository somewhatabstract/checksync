name: Dependabot Pull Request Approve and Merge

# `pull_request` rather than `pull_request_target`, as GitHub recommends for
# Dependabot automation: `pull_request_target` runs with write access for
# pull requests from anyone, including forks. Pull requests Dependabot opens
# get the permissions below; pull requests from forks only ever get read
# access.
on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Only run for pull requests Dependabot opened. This checks who opened the
    # pull request, not `github.actor`, which is whoever acted on it last and
    # can be made to read `dependabot[bot]` on someone else's pull request.
    # The repository check stops it running in forks that enable Dependabot.
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'somewhatabstract/checksync'
    steps:
      # This fails, so nothing below runs, unless the pull request and its
      # first commit come from Dependabot and that commit's signature is
      # verified.
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # Here the PR gets approved.
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Finally, this sets the PR to allow auto-merging for patch and minor
      # updates if all checks pass
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
